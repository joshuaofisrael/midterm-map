name: Live election results

# The static site is too large to rebuild every few minutes (~32,000 pages).
# This job does not run next build and does not deploy GitHub Pages.
# It writes one small JSON file to the live-results branch.
# Browsers read /live/results.json on this site. They do not call this branch.
# Cloudflare (see docs/election-night-scale-plan.md) serves that path from
# the branch file. A full Pages deploy every 5 minutes would re-upload the
# whole site and can trip the 10-minute deploy timeout.
#
# GitHub cron is UTC and has no year field. These two schedules cover
# 3 November through 16 December, every 5 minutes at minutes 2, 7, 12, ...
# The job then continues only when the UTC date is inside
# 2026-11-03 .. 2026-12-16. A manual run can still use dry_run.
# Checkout does not keep credentials. publish.mjs authenticates with
# GITHUB_TOKEN itself.

on:
  schedule:
    - cron: "2-57/5 * 3-30 11 *"
    - cron: "2-57/5 * 1-16 12 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and write the JSON without publishing the branch
        type: boolean
        default: false
      stop_counting:
        description: Stop later-day checks after this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Continue only inside the 2026 counting window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          if [[ "$today" < "2026-11-03" || "$today" > "2026-12-16" ]]; then
            echo "Outside 3 November–16 December 2026 UTC ($today)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch official results
        id: fetch
        if: steps.window.outputs.run == 'true'
        run: node scripts/live/fetch.mjs
        env:
          LIVE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || '' }}
          LIVE_STOP: ${{ github.event_name == 'workflow_dispatch' && (inputs.stop_counting == true || inputs.stop_counting == 'true') && 'true' || '' }}

      - name: Legal hold before publish
        if: steps.window.outputs.run == 'true' && steps.fetch.outputs.publish == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/check-legal-hold.ts --paths public/live/results.json

      - name: Publish results JSON
        if: steps.window.outputs.run == 'true' && steps.fetch.outputs.publish == 'true'
        run: node scripts/live/publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
